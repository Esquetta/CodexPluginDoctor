name: Codex Plugin Doctor
description: Validate Codex plugin packages in GitHub Actions.

inputs:
  version:
    description: codex-plugin-doctor npm version to install.
    required: false
    default: "latest"
  path:
    description: Path to the Codex plugin package root.
    required: false
    default: "."
  check:
    description: Run the plugin package check and its JSON, Markdown, and SARIF reports. Set to false for repositories without a plugin package; another Action mode must then be configured.
    required: false
    default: "true"
  runtime:
    description: Run optional MCP runtime probing.
    required: false
    default: "false"
  allow-network:
    description: Explicitly allow remote MCP runtime probes to make outbound network requests.
    required: false
    default: "false"
  allow-local-network:
    description: Explicitly allow remote MCP runtime probes to contact loopback endpoints only (localhost, 127.0.0.0/8, or ::1). Private, link-local, multicast, unspecified, reserved, and NAT64 ranges remain blocked.
    required: false
    default: "false"
  allow-session-lifecycle:
    description: Explicitly allow remote MCP runtime probing to send one state-changing session termination request when a valid session is issued.
    required: false
    default: "false"
  require-remote-reliability:
    description: Fail the validation result unless every attempted remote MCP reliability scorecard passes; this does not grant network access.
    required: false
    default: "false"
  registry-metadata:
    description: Optional local server.json file or containing directory to validate for MCP Registry readiness.
    required: false
    default: ""
  require-registry-readiness:
    description: Fail unless the configured local Registry metadata receives a pass result.
    required: false
    default: "false"
  submission:
    description: Generate offline public directory submission preflight JSON and Markdown reports.
    required: false
    default: "false"
  submission-archive:
    description: Optional existing ZIP path for offline skills-only archive submission preflight reports.
    required: false
    default: ""
  require-submission-ready:
    description: Fail unless the offline submission preflight is automatically ready; this does not replace manual review.
    required: false
    default: "false"
  snapshot-url:
    description: Optional HTTP MCP endpoint whose tool, prompt, and resource template lists are saved to output-dir with doctor mcp-snapshot --save-dir, as mcp-tools-current.json, mcp-prompts-current.json, and mcp-resource-templates-current.json. Each saved list becomes the after input of its comparison when that comparison's before input is set and its after input is empty. Requires allow-network and CLI 1.81.0 or later in version; it cannot be combined with the tools-, prompts-, or resource-templates-capture inputs.
    required: false
    default: ""
  snapshot-server:
    description: Optional name of a local stdio MCP server from the package at path that doctor mcp-snapshot --server --runtime starts once to save every list it offers, like snapshot-url. Requires runtime and CLI 1.81.0 or later in version; it cannot be combined with snapshot-url, installed, or the tools-, prompts-, or resource-templates-capture inputs.
    required: false
    default: ""
  snapshot-sandbox:
    description: Optional sandbox for snapshot-server, like tools-capture-sandbox.
    required: false
    default: ""
  snapshot-env:
    description: Optional names of host environment variables that snapshot-sandbox docker passes into the container by name, like tools-capture-env.
    required: false
    default: ""
  snapshot-defer-findings:
    description: When "true", catalog warnings and failures found during a snapshot do not fail this step, like tools-capture-defer-findings. A list the server offers but that cannot be read completely still records status 2.
    required: false
    default: "false"
  snapshot-token-env:
    description: Optional name of an environment variable that holds a bearer token for snapshot-url, like tools-capture-token-env.
    required: false
    default: ""
  tools-capture-url:
    description: Optional HTTP MCP endpoint whose complete tool list is saved to output-dir with doctor tools --save-response. Requires allow-network; loopback endpoints also require allow-local-network. When tools-diff-before is set and tools-diff-after is empty, the capture becomes the comparison's after input.
    required: false
    default: ""
  tools-capture-server:
    description: Optional name of a local stdio MCP server from the package at path whose complete tool list is saved to output-dir with doctor tools --server --runtime --save-response. Starting the server runs package code, so it requires runtime; it cannot be combined with tools-capture-url or installed. When tools-diff-before is set and tools-diff-after is empty, the capture becomes the comparison's after input.
    required: false
    default: ""
  tools-capture-sandbox:
    description: Optional sandbox for tools-capture-server. docker starts the server through doctor tools --sandbox docker (Node.js commands only, no network, read-only package mount, no host environment). Requires CLI 1.72.0 or later in version for tools-capture-env.
    required: false
    default: ""
  tools-capture-env:
    description: Optional names of host environment variables, separated by commas, spaces, or new lines, that tools-capture-sandbox docker passes into the container by name with --env. Set the variables in the calling step's env; their values are never printed or placed in command arguments.
    required: false
    default: ""
  tools-capture-defer-findings:
    description: When "true", catalog warnings and failures found during a capture that saved its list do not fail this step, for a later tools-diff such as one in another job; that comparison re-checks only the saved list, not findings from the live run. A capture that saves nothing still records status 2.
    required: false
    default: "false"
  tools-capture-token-env:
    description: Optional name of an environment variable that holds a bearer token for tools-capture-url. The token is sent only over HTTPS or to an approved loopback endpoint and is never printed or saved. Set the variable from a secret in the calling step's env.
    required: false
    default: ""
  tools-diff-before:
    description: Optional saved MCP tools/list response used as the baseline for an offline tool definition diff. Requires tools-diff-after.
    required: false
    default: ""
  tools-diff-after:
    description: Optional saved MCP tools/list response compared against tools-diff-before. Requires tools-diff-before.
    required: false
    default: ""
  tools-diff-comment:
    description: Post or update one pull request comment with the tool diff summary when the diff runs on a pull_request or pull_request_target event. Requires pull-requests write permission for github-token; when the comment cannot be posted, such as for pull requests from forks, the Action warns and does not fail.
    required: false
    default: "false"
  github-token:
    description: Token for the tool, prompt, and resource template diff comment step, set only in that step's environment. Needs pull-requests write permission. The comment is skipped, without giving the token to any step, when runtime, the publish profile, or the codex-publish or mcp-strict policy lets this invocation run package code.
    required: false
    default: ${{ github.token }}
  tools-diff-fail-on:
    description: Tool diff failure mode. any fails on every change or input warning; breaking fails only on breaking or unclassified changes.
    required: false
    default: "any"
  prompts-capture-url:
    description: Optional HTTP MCP endpoint whose complete prompt list is saved to output-dir with doctor prompts --save-response, like tools-capture-url. Requires allow-network and CLI 1.77.0 or later in version. When prompts-diff-before is set and prompts-diff-after is empty, the capture becomes the comparison's after input.
    required: false
    default: ""
  prompts-capture-server:
    description: Optional name of a local stdio MCP server from the package at path whose complete prompt list is saved to output-dir with doctor prompts --server --runtime --save-response, like tools-capture-server. Requires runtime and CLI 1.77.0 or later in version; it cannot be combined with prompts-capture-url or installed.
    required: false
    default: ""
  prompts-capture-sandbox:
    description: Optional sandbox for prompts-capture-server, like tools-capture-sandbox.
    required: false
    default: ""
  prompts-capture-env:
    description: Optional names of host environment variables that prompts-capture-sandbox docker passes into the container by name, like tools-capture-env.
    required: false
    default: ""
  prompts-capture-defer-findings:
    description: When "true", catalog warnings and failures found during a prompt capture that saved its list do not fail this step, like tools-capture-defer-findings.
    required: false
    default: "false"
  prompts-capture-token-env:
    description: Optional name of an environment variable that holds a bearer token for prompts-capture-url, like tools-capture-token-env.
    required: false
    default: ""
  prompts-diff-before:
    description: Optional saved MCP prompts/list response used as the baseline for an offline prompt definition diff. Requires prompts-diff-after (or a prompt capture) and CLI 1.77.0 or later in version.
    required: false
    default: ""
  prompts-diff-after:
    description: Optional saved MCP prompts/list response compared against prompts-diff-before. Requires prompts-diff-before.
    required: false
    default: ""
  prompts-diff-comment:
    description: Post or update one pull request comment with the prompt diff summary, separate from the tool diff comment and under the same conditions as tools-diff-comment.
    required: false
    default: "false"
  prompts-diff-fail-on:
    description: Prompt diff failure mode. any fails on every change or input warning; breaking fails only on breaking or unclassified changes.
    required: false
    default: "any"
  resource-templates-capture-url:
    description: Optional HTTP MCP endpoint whose complete resource template list is saved to output-dir with doctor resource-templates --save-response, like tools-capture-url. Requires allow-network and CLI 1.79.0 or later in version. When resource-templates-diff-before is set and resource-templates-diff-after is empty, the capture becomes the comparison's after input.
    required: false
    default: ""
  resource-templates-capture-server:
    description: Optional name of a local stdio MCP server from the package at path whose complete resource template list is saved to output-dir with doctor resource-templates --server --runtime --save-response, like tools-capture-server. Requires runtime and CLI 1.79.0 or later in version; it cannot be combined with resource-templates-capture-url or installed.
    required: false
    default: ""
  resource-templates-capture-sandbox:
    description: Optional sandbox for resource-templates-capture-server, like tools-capture-sandbox.
    required: false
    default: ""
  resource-templates-capture-env:
    description: Optional names of host environment variables that resource-templates-capture-sandbox docker passes into the container by name, like tools-capture-env.
    required: false
    default: ""
  resource-templates-capture-defer-findings:
    description: When "true", catalog warnings and failures found during a resource template capture that saved its list do not fail this step, like tools-capture-defer-findings.
    required: false
    default: "false"
  resource-templates-capture-token-env:
    description: Optional name of an environment variable that holds a bearer token for resource-templates-capture-url, like tools-capture-token-env.
    required: false
    default: ""
  resource-templates-diff-before:
    description: Optional saved MCP resources/templates/list response used as the baseline for an offline resource template diff. Requires resource-templates-diff-after (or a resource template capture) and CLI 1.79.0 or later in version.
    required: false
    default: ""
  resource-templates-diff-after:
    description: Optional saved MCP resources/templates/list response compared against resource-templates-diff-before. Requires resource-templates-diff-before.
    required: false
    default: ""
  resource-templates-diff-comment:
    description: Post or update one pull request comment with the resource template diff summary, separate from the tool and prompt diff comments and under the same conditions as tools-diff-comment.
    required: false
    default: "false"
  resource-templates-diff-fail-on:
    description: Resource template diff failure mode. any fails on every change or input warning; breaking fails only on breaking or unclassified changes.
    required: false
    default: "any"
  installed:
    description: Validate plugins from the local Codex plugin cache.
    required: false
    default: "false"
  filter:
    description: Optional installed plugin name/path filter.
    required: false
    default: ""
  config:
    description: Optional path to .codex-doctor.json.
    required: false
    default: ""
  history:
    description: Optional JSONL path for validation history output.
    required: false
    default: ""
  policy:
    description: Optional policy preset to apply. Supported values are codex-publish, mcp-strict, and security.
    required: false
    default: ""
  profile:
    description: Optional check profile to apply. Supported values are ci, strict, and publish.
    required: false
    default: ""
  output-dir:
    description: Directory where JSON, Markdown, and SARIF reports are written.
    required: false
    default: codex-plugin-doctor-reports
  artifact-name:
    description: GitHub Actions artifact name for uploaded report files.
    required: false
    default: codex-plugin-doctor-reports
  upload-artifact:
    description: Upload the generated report directory as a workflow artifact.
    required: false
    default: "true"
  step-summary:
    description: Append the Markdown report to the GitHub Actions step summary.
    required: false
    default: "true"
  json:
    description: Write a machine-readable JSON report into the output directory.
    required: false
    default: "true"
  markdown:
    description: Write a CI-friendly Markdown summary into the output directory.
    required: false
    default: "true"
  sarif:
    description: Write SARIF output into the output directory.
    required: false
    default: "false"
  corpus:
    description: Write bundled validation corpus JSON into the output directory.
    required: false
    default: "false"
  corpus-metrics-manifest:
    description: Optional path to a private corpus metrics manifest to evaluate.
    required: false
    default: ""
  corpus-metrics-baseline:
    description: Optional path to a previous corpus metrics JSON report for regression comparison.
    required: false
    default: ""
  corpus-metrics-fail-on-regression:
    description: Fail when corpus precision or recall decreases, or false-positive share increases.
    required: false
    default: "false"
  contract:
    description: Write public output contract JSON into the output directory.
    required: false
    default: "false"
  review-bundle:
    description: Write a signed review bundle directory into the output directory.
    required: false
    default: "false"
  review-bundle-dir:
    description: Directory name for the generated review bundle inside output-dir.
    required: false
    default: review-bundle
  review-bundle-verify:
    description: Verify the generated review bundle and write a verification JSON report.
    required: false
    default: "false"
  signing-key-env:
    description: Environment variable name that contains the local HMAC signing key for review bundle artifacts.
    required: false
    default: CODEX_PLUGIN_DOCTOR_SIGNING_KEY
  review-bundle-allow-dirty:
    description: Allow dirty git worktrees when generating review bundle release evidence.
    required: false
    default: "false"
  review-bundle-allow-untagged:
    description: Allow untagged commits when generating review bundle release evidence.
    required: false
    default: "true"

outputs:
  status:
    description: Exit status returned by the primary validation run.
    value: ${{ steps.run-doctor.outputs.status }}
  report-dir:
    description: Directory containing generated Codex Plugin Doctor reports.
    value: ${{ steps.run-doctor.outputs.report-dir }}
  summary-path:
    description: Path to the generated Markdown summary report.
    value: ${{ steps.run-doctor.outputs.summary-path }}
  json-path:
    description: Path to the generated JSON report.
    value: ${{ steps.run-doctor.outputs.json-path }}
  sarif-path:
    description: Path to the generated SARIF report when sarif is enabled.
    value: ${{ steps.run-doctor.outputs.sarif-path }}
  validation-corpus-path:
    description: Path to the generated validation corpus JSON report when corpus is enabled.
    value: ${{ steps.run-doctor.outputs.validation-corpus-path }}
  corpus-metrics-path:
    description: Path to the generated corpus quality metrics JSON report when configured.
    value: ${{ steps.run-doctor.outputs.corpus-metrics-path }}
  corpus-metrics-diff-path:
    description: Path to the generated corpus quality regression JSON report when a baseline is configured.
    value: ${{ steps.run-doctor.outputs.corpus-metrics-diff-path }}
  output-contract-path:
    description: Path to the generated output contract JSON report when contract is enabled.
    value: ${{ steps.run-doctor.outputs.output-contract-path }}
  action-manifest-path:
    description: Path to the generated GitHub Action artifact manifest.
    value: ${{ steps.run-doctor.outputs.action-manifest-path }}
  registry-report-path:
    description: Path to the MCP Registry readiness JSON report when registry-metadata is configured.
    value: ${{ steps.run-doctor.outputs.registry-report-path }}
  submission-json-path:
    description: Path to the offline submission preflight JSON report when submission is enabled.
    value: ${{ steps.run-doctor.outputs.submission-json-path }}
  submission-summary-path:
    description: Path to the offline submission preflight Markdown report when submission is enabled.
    value: ${{ steps.run-doctor.outputs.submission-summary-path }}
  submission-archive-json-path:
    description: Path to the offline archive submission preflight JSON report when submission-archive is configured.
    value: ${{ steps.run-doctor.outputs.submission-archive-json-path }}
  submission-archive-summary-path:
    description: Path to the offline archive submission preflight Markdown report when submission-archive is configured.
    value: ${{ steps.run-doctor.outputs.submission-archive-summary-path }}
  tools-capture-path:
    description: Path to the saved MCP tools/list response when tools-capture-url or tools-capture-server is configured and the capture completed.
    value: ${{ steps.run-doctor.outputs.tools-capture-path }}
  tools-diff-json-path:
    description: Path to the offline MCP tool diff JSON report when tools-diff-before and tools-diff-after are configured.
    value: ${{ steps.run-doctor.outputs.tools-diff-json-path }}
  tools-diff-summary-path:
    description: Path to the offline MCP tool diff Markdown summary when tools-diff-before and tools-diff-after are configured.
    value: ${{ steps.run-doctor.outputs.tools-diff-summary-path }}
  prompts-capture-path:
    description: Path to the saved MCP prompts/list response when prompts-capture-url or prompts-capture-server is configured and the capture completed.
    value: ${{ steps.run-doctor.outputs.prompts-capture-path }}
  prompts-diff-json-path:
    description: Path to the offline MCP prompt diff JSON report when the prompt diff ran.
    value: ${{ steps.run-doctor.outputs.prompts-diff-json-path }}
  prompts-diff-summary-path:
    description: Path to the offline MCP prompt diff Markdown summary when the prompt diff ran.
    value: ${{ steps.run-doctor.outputs.prompts-diff-summary-path }}
  resource-templates-capture-path:
    description: Path to the saved MCP resources/templates/list response when resource-templates-capture-url or resource-templates-capture-server is configured and the capture completed.
    value: ${{ steps.run-doctor.outputs.resource-templates-capture-path }}
  resource-templates-diff-json-path:
    description: Path to the offline MCP resource template diff JSON report when the resource template diff ran.
    value: ${{ steps.run-doctor.outputs.resource-templates-diff-json-path }}
  resource-templates-diff-summary-path:
    description: Path to the offline MCP resource template diff Markdown summary when the resource template diff ran.
    value: ${{ steps.run-doctor.outputs.resource-templates-diff-summary-path }}
  review-bundle-path:
    description: Path to the generated review bundle directory when review-bundle is enabled.
    value: ${{ steps.run-doctor.outputs.review-bundle-path }}
  review-bundle-verification-path:
    description: Path to the generated review bundle verification report when review-bundle-verify is enabled.
    value: ${{ steps.run-doctor.outputs.review-bundle-verification-path }}

runs:
  using: composite
  steps:
    - name: Install Codex Plugin Doctor
      shell: bash
      env:
        VERSION_INPUT: ${{ inputs.version }}
      run: |
        # A comparison recorded by an earlier invocation in this job must not be published if this one fails.
        rm -f "${RUNNER_TEMP:-.}/codex-plugin-doctor-tools-diff-ran" "${RUNNER_TEMP:-.}/codex-plugin-doctor-prompts-diff-ran" \
          "${RUNNER_TEMP:-.}/codex-plugin-doctor-resource-templates-diff-ran"
        npm install -g "codex-plugin-doctor@${VERSION_INPUT}"

    - name: Run Codex Plugin Doctor
      id: run-doctor
      shell: bash
      env:
        ALLOW_NETWORK_INPUT: ${{ inputs['allow-network'] }}
        ALLOW_LOCAL_NETWORK_INPUT: ${{ inputs['allow-local-network'] }}
        ALLOW_SESSION_LIFECYCLE_INPUT: ${{ inputs['allow-session-lifecycle'] }}
        REQUIRE_REMOTE_RELIABILITY_INPUT: ${{ inputs['require-remote-reliability'] }}
        REGISTRY_METADATA_INPUT: ${{ inputs['registry-metadata'] }}
        REQUIRE_REGISTRY_READINESS_INPUT: ${{ inputs['require-registry-readiness'] }}
        SUBMISSION_INPUT: ${{ inputs.submission }}
        SUBMISSION_ARCHIVE_INPUT: ${{ inputs['submission-archive'] }}
        REQUIRE_SUBMISSION_READY_INPUT: ${{ inputs['require-submission-ready'] }}
        CORPUS_METRICS_MANIFEST_INPUT: ${{ inputs['corpus-metrics-manifest'] }}
        CORPUS_METRICS_BASELINE_INPUT: ${{ inputs['corpus-metrics-baseline'] }}
        CORPUS_METRICS_FAIL_ON_REGRESSION_INPUT: ${{ inputs['corpus-metrics-fail-on-regression'] }}
        CHECK_INPUT: ${{ inputs.check }}
        RUNTIME_INPUT: ${{ inputs.runtime }}
        SNAPSHOT_URL_INPUT: ${{ inputs['snapshot-url'] }}
        SNAPSHOT_SERVER_INPUT: ${{ inputs['snapshot-server'] }}
        SNAPSHOT_SANDBOX_INPUT: ${{ inputs['snapshot-sandbox'] }}
        SNAPSHOT_ENV_INPUT: ${{ inputs['snapshot-env'] }}
        SNAPSHOT_DEFER_FINDINGS_INPUT: ${{ inputs['snapshot-defer-findings'] }}
        SNAPSHOT_TOKEN_ENV_INPUT: ${{ inputs['snapshot-token-env'] }}
        TOOLS_CAPTURE_URL_INPUT: ${{ inputs['tools-capture-url'] }}
        TOOLS_CAPTURE_SERVER_INPUT: ${{ inputs['tools-capture-server'] }}
        TOOLS_CAPTURE_SANDBOX_INPUT: ${{ inputs['tools-capture-sandbox'] }}
        TOOLS_CAPTURE_ENV_INPUT: ${{ inputs['tools-capture-env'] }}
        TOOLS_CAPTURE_DEFER_FINDINGS_INPUT: ${{ inputs['tools-capture-defer-findings'] }}
        PACKAGE_PATH_INPUT: ${{ inputs.path }}
        INSTALLED_INPUT: ${{ inputs.installed }}
        TOOLS_CAPTURE_TOKEN_ENV_INPUT: ${{ inputs['tools-capture-token-env'] }}
        TOOLS_DIFF_BEFORE_INPUT: ${{ inputs['tools-diff-before'] }}
        TOOLS_DIFF_AFTER_INPUT: ${{ inputs['tools-diff-after'] }}
        TOOLS_DIFF_FAIL_ON_INPUT: ${{ inputs['tools-diff-fail-on'] }}
        PROMPTS_CAPTURE_URL_INPUT: ${{ inputs['prompts-capture-url'] }}
        PROMPTS_CAPTURE_SERVER_INPUT: ${{ inputs['prompts-capture-server'] }}
        PROMPTS_CAPTURE_SANDBOX_INPUT: ${{ inputs['prompts-capture-sandbox'] }}
        PROMPTS_CAPTURE_ENV_INPUT: ${{ inputs['prompts-capture-env'] }}
        PROMPTS_CAPTURE_DEFER_FINDINGS_INPUT: ${{ inputs['prompts-capture-defer-findings'] }}
        PROMPTS_CAPTURE_TOKEN_ENV_INPUT: ${{ inputs['prompts-capture-token-env'] }}
        PROMPTS_DIFF_BEFORE_INPUT: ${{ inputs['prompts-diff-before'] }}
        PROMPTS_DIFF_AFTER_INPUT: ${{ inputs['prompts-diff-after'] }}
        PROMPTS_DIFF_FAIL_ON_INPUT: ${{ inputs['prompts-diff-fail-on'] }}
        RESOURCE_TEMPLATES_CAPTURE_URL_INPUT: ${{ inputs['resource-templates-capture-url'] }}
        RESOURCE_TEMPLATES_CAPTURE_SERVER_INPUT: ${{ inputs['resource-templates-capture-server'] }}
        RESOURCE_TEMPLATES_CAPTURE_SANDBOX_INPUT: ${{ inputs['resource-templates-capture-sandbox'] }}
        RESOURCE_TEMPLATES_CAPTURE_ENV_INPUT: ${{ inputs['resource-templates-capture-env'] }}
        RESOURCE_TEMPLATES_CAPTURE_DEFER_FINDINGS_INPUT: ${{ inputs['resource-templates-capture-defer-findings'] }}
        RESOURCE_TEMPLATES_CAPTURE_TOKEN_ENV_INPUT: ${{ inputs['resource-templates-capture-token-env'] }}
        RESOURCE_TEMPLATES_DIFF_BEFORE_INPUT: ${{ inputs['resource-templates-diff-before'] }}
        RESOURCE_TEMPLATES_DIFF_AFTER_INPUT: ${{ inputs['resource-templates-diff-after'] }}
        RESOURCE_TEMPLATES_DIFF_FAIL_ON_INPUT: ${{ inputs['resource-templates-diff-fail-on'] }}
        OUTPUT_DIR_INPUT: ${{ inputs['output-dir'] }}
        REVIEW_BUNDLE_DIR_INPUT: ${{ inputs['review-bundle-dir'] }}
        FILTER_INPUT: ${{ inputs.filter }}
        CONFIG_INPUT: ${{ inputs.config }}
        HISTORY_INPUT: ${{ inputs.history }}
        POLICY_INPUT: ${{ inputs.policy }}
        PROFILE_INPUT: ${{ inputs.profile }}
        JSON_INPUT: ${{ inputs.json }}
        MARKDOWN_INPUT: ${{ inputs.markdown }}
        SARIF_INPUT: ${{ inputs.sarif }}
        CORPUS_INPUT: ${{ inputs.corpus }}
        CONTRACT_INPUT: ${{ inputs.contract }}
        REVIEW_BUNDLE_INPUT: ${{ inputs['review-bundle'] }}
        SIGNING_KEY_ENV_INPUT: ${{ inputs['signing-key-env'] }}
        REVIEW_BUNDLE_ALLOW_DIRTY_INPUT: ${{ inputs['review-bundle-allow-dirty'] }}
        REVIEW_BUNDLE_ALLOW_UNTAGGED_INPUT: ${{ inputs['review-bundle-allow-untagged'] }}
        REVIEW_BUNDLE_VERIFY_INPUT: ${{ inputs['review-bundle-verify'] }}
        ARTIFACT_NAME_INPUT: ${{ inputs['artifact-name'] }}
      run: |
        set -euo pipefail

        # A comparison recorded by an earlier invocation in this job must not be published if this one stops early.
        rm -f "${RUNNER_TEMP:-.}/codex-plugin-doctor-tools-diff-ran" "${RUNNER_TEMP:-.}/codex-plugin-doctor-prompts-diff-ran" \
          "${RUNNER_TEMP:-.}/codex-plugin-doctor-resource-templates-diff-ran"

        # Exits before any Doctor command, recording status 2 for the later steps and the status output
        # and clearing state that an earlier invocation in the same job left behind.
        reject_usage() {
          local state_dir="${RUNNER_TEMP:-.}"
          printf "2" > "$state_dir/codex-plugin-doctor-status"
          for state in submission-ran submission-archive-ran tools-diff-ran prompts-diff-ran resource-templates-diff-ran check-ran; do
            printf "false" > "$state_dir/codex-plugin-doctor-$state"
          done
          echo "status=2" >> "$GITHUB_OUTPUT"
          echo "$1" >&2
          exit 2
        }

        # Names are split on commas and whitespace; each becomes one --env argument.
        capture_env_names() {
          local names=()
          read -r -a names <<< "${1//[,$'\n'$'\r']/ }"
          if (( ${#names[@]} > 0 )); then printf '%s\n' "${names[@]}"; fi
        }

        # Validates one set of capture inputs, before any command runs. Arguments: the input name prefix
        # (snapshot, tools-capture, prompts-capture, or resource-templates-capture), then its url, server,
        # sandbox, env names, defer findings, and token env inputs.
        validate_capture_inputs() {
          local prefix="$1" url="$2" server="$3" sandbox="$4" env_input="$5" defer="$6" token_env="$7"
          if [[ "$RUNTIME_INPUT" == "true" && -n "$token_env" ]]; then
            reject_usage "$prefix-token-env cannot be combined with runtime probing. Use separate Action steps."
          fi

          # Rejected before any command, because runtime probing in the package check could otherwise start servers first.
          if [[ -n "$server" && -n "$url" ]]; then
            reject_usage "$prefix-url and $prefix-server cannot be combined."
          fi

          if [[ -n "$server" && "$INSTALLED_INPUT" == "true" ]]; then
            reject_usage "$prefix-server reads the package at path and cannot be combined with installed: true."
          fi

          if [[ -n "$sandbox" && "$sandbox" != "docker" ]]; then
            reject_usage "$prefix-sandbox must be docker or empty."
          fi

          if [[ -n "$sandbox" && -z "$server" ]]; then
            reject_usage "$prefix-sandbox requires $prefix-server."
          fi

          local names=() seen=" " name
          mapfile -t names < <(capture_env_names "$env_input")
          if (( ${#names[@]} > 0 )) && [[ "$sandbox" != "docker" ]]; then
            reject_usage "$prefix-env requires $prefix-sandbox: docker; a native server already inherits the step's environment."
          fi
          for name in "${names[@]}"; do
            if [[ ! "$name" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              reject_usage "$prefix-env must list environment variable names."
            fi
            if [[ "$seen" == *" $name "* ]]; then
              reject_usage "$prefix-env lists $name more than once."
            fi
            seen+="$name "
          done

          if [[ "$defer" != "true" && "$defer" != "false" ]]; then
            reject_usage "$prefix-defer-findings must be true or false."
          fi
        }

        validate_capture_inputs snapshot "$SNAPSHOT_URL_INPUT" "$SNAPSHOT_SERVER_INPUT" "$SNAPSHOT_SANDBOX_INPUT" \
          "$SNAPSHOT_ENV_INPUT" "$SNAPSHOT_DEFER_FINDINGS_INPUT" "$SNAPSHOT_TOKEN_ENV_INPUT"
        if [[ ( -n "$SNAPSHOT_URL_INPUT" || -n "$SNAPSHOT_SERVER_INPUT" ) && -n "$TOOLS_CAPTURE_URL_INPUT$TOOLS_CAPTURE_SERVER_INPUT$PROMPTS_CAPTURE_URL_INPUT$PROMPTS_CAPTURE_SERVER_INPUT$RESOURCE_TEMPLATES_CAPTURE_URL_INPUT$RESOURCE_TEMPLATES_CAPTURE_SERVER_INPUT" ]]; then
          reject_usage "snapshot-url and snapshot-server cannot be combined with the tools-, prompts-, or resource-templates-capture inputs."
        fi
        validate_capture_inputs tools-capture "$TOOLS_CAPTURE_URL_INPUT" "$TOOLS_CAPTURE_SERVER_INPUT" "$TOOLS_CAPTURE_SANDBOX_INPUT" \
          "$TOOLS_CAPTURE_ENV_INPUT" "$TOOLS_CAPTURE_DEFER_FINDINGS_INPUT" "$TOOLS_CAPTURE_TOKEN_ENV_INPUT"
        validate_capture_inputs prompts-capture "$PROMPTS_CAPTURE_URL_INPUT" "$PROMPTS_CAPTURE_SERVER_INPUT" "$PROMPTS_CAPTURE_SANDBOX_INPUT" \
          "$PROMPTS_CAPTURE_ENV_INPUT" "$PROMPTS_CAPTURE_DEFER_FINDINGS_INPUT" "$PROMPTS_CAPTURE_TOKEN_ENV_INPUT"
        validate_capture_inputs resource-templates-capture "$RESOURCE_TEMPLATES_CAPTURE_URL_INPUT" "$RESOURCE_TEMPLATES_CAPTURE_SERVER_INPUT" \
          "$RESOURCE_TEMPLATES_CAPTURE_SANDBOX_INPUT" "$RESOURCE_TEMPLATES_CAPTURE_ENV_INPUT" "$RESOURCE_TEMPLATES_CAPTURE_DEFER_FINDINGS_INPUT" \
          "$RESOURCE_TEMPLATES_CAPTURE_TOKEN_ENV_INPUT"

        # Values that look like options would be read as flags such as --runtime, and the CLI would
        # then run package code without runtime: "true".
        if [[ "$PACKAGE_PATH_INPUT" == -* ]]; then
          reject_usage "path must not start with -; use ./ before a directory name that starts with -."
        fi

        if [[ "$FILTER_INPUT" == -* ]]; then
          reject_usage "filter must not start with -; use ./ before a path that starts with -."
        fi

        # The name is expanded indirectly, and bash evaluates an array subscript in it as code.
        if [[ "$REVIEW_BUNDLE_INPUT" == "true" && -n "$SIGNING_KEY_ENV_INPUT" && ! "$SIGNING_KEY_ENV_INPUT" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
          reject_usage "signing-key-env must be an environment variable name."
        fi

        # Directory paths are written to GITHUB_OUTPUT, where a line break would add another output.
        if [[ "$OUTPUT_DIR_INPUT" == *$'\n'* || "$OUTPUT_DIR_INPUT" == *$'\r'* ]]; then
          reject_usage "output-dir must be a single line."
        fi

        if [[ "$REVIEW_BUNDLE_DIR_INPUT" == *$'\n'* || "$REVIEW_BUNDLE_DIR_INPUT" == *$'\r'* ]]; then
          reject_usage "review-bundle-dir must be a single line."
        fi

        report_dir="${OUTPUT_DIR_INPUT}"
        summary_path="$report_dir/codex-plugin-doctor-summary.md"
        json_path="$report_dir/codex-plugin-doctor-report.json"
        sarif_path="$report_dir/codex-plugin-doctor.sarif"
        validation_corpus_path="$report_dir/validation-corpus.json"
        corpus_metrics_path="$report_dir/corpus-metrics.json"
        corpus_metrics_diff_path="$report_dir/corpus-metrics-diff.json"
        output_contract_path="$report_dir/output-contract.json"
        action_manifest_path="$report_dir/codex-plugin-doctor-action-manifest.json"
        registry_report_path="$report_dir/mcp-registry-readiness.json"
        submission_json_path="$report_dir/codex-plugin-doctor-submission.json"
        submission_summary_path="$report_dir/codex-plugin-doctor-submission.md"
        submission_archive_json_path="$report_dir/codex-plugin-doctor-submission-archive.json"
        submission_archive_summary_path="$report_dir/codex-plugin-doctor-submission-archive.md"
        review_bundle_path="$report_dir/${REVIEW_BUNDLE_DIR_INPUT}"
        review_bundle_verification_path="$report_dir/review-bundle-verification.json"
        status_file="${RUNNER_TEMP:-.}/codex-plugin-doctor-status"
        submission_state_file="${RUNNER_TEMP:-.}/codex-plugin-doctor-submission-ran"
        submission_archive_state_file="${RUNNER_TEMP:-.}/codex-plugin-doctor-submission-archive-ran"
        tools_diff_state_file="${RUNNER_TEMP:-.}/codex-plugin-doctor-tools-diff-ran"
        prompts_diff_state_file="${RUNNER_TEMP:-.}/codex-plugin-doctor-prompts-diff-ran"
        resource_templates_diff_state_file="${RUNNER_TEMP:-.}/codex-plugin-doctor-resource-templates-diff-ran"
        check_state_file="${RUNNER_TEMP:-.}/codex-plugin-doctor-check-ran"
        status=0
        submission_ran=false
        submission_archive_ran=false
        submission_json_output=""
        submission_summary_output=""
        submission_archive_json_output=""
        submission_archive_summary_output=""
        check_ran=false
        tools_capture_output=""
        tools_diff_ran=false
        tools_diff_json_output=""
        tools_diff_summary_output=""
        prompts_capture_output=""
        prompts_diff_ran=false
        prompts_diff_json_output=""
        prompts_diff_summary_output=""
        resource_templates_capture_output=""
        resource_templates_diff_ran=false
        resource_templates_diff_json_output=""
        resource_templates_diff_summary_output=""
        doctor_version="$(codex-plugin-doctor --version)"

        mkdir -p "$report_dir"

        args=(check)
        history_args=()

        if [[ "${INSTALLED_INPUT}" == "true" ]]; then
          args+=(--installed)
          if [[ -n "${FILTER_INPUT}" ]]; then
            args+=("${FILTER_INPUT}")
          fi
        else
          args+=("${PACKAGE_PATH_INPUT}")
        fi

        if [[ "${RUNTIME_INPUT}" == "true" ]]; then
          args+=(--runtime)
        fi

        if [[ "$ALLOW_NETWORK_INPUT" == "true" ]]; then
          args+=(--allow-network)
        fi

        if [[ "$ALLOW_LOCAL_NETWORK_INPUT" == "true" ]]; then
          args+=(--allow-local-network)
        fi

        if [[ "$ALLOW_SESSION_LIFECYCLE_INPUT" == "true" ]]; then
          args+=(--allow-session-lifecycle)
        fi

        if [[ "$REQUIRE_REMOTE_RELIABILITY_INPUT" == "true" ]]; then
          args+=(--require-remote-reliability)
        fi

        if [[ -n "${CONFIG_INPUT}" ]]; then
          args+=(--config "${CONFIG_INPUT}")
        fi

        if [[ -n "${HISTORY_INPUT}" ]]; then
          history_args+=(--history "${HISTORY_INPUT}")
        fi

        if [[ -n "${POLICY_INPUT}" ]]; then
          args+=(--policy "${POLICY_INPUT}")
        fi

        if [[ -n "${PROFILE_INPUT}" ]]; then
          args+=(--profile "${PROFILE_INPUT}")
        fi

        record_status() {
          local code="$1"

          if [[ "$code" -ne 0 && "$status" -eq 0 ]]; then
            status="$code"
          fi
        }

        run_doctor() {
          local label="$1"
          shift

          echo "::group::$label"
          set +e
          codex-plugin-doctor "$@"
          local code="$?"
          set -e

          if [[ "$code" -ne 0 ]]; then
            echo "Codex Plugin Doctor ${label} exited with status ${code}."
          fi

          echo "::endgroup::"
          record_status "$code"
        }

        if [[ "$CHECK_INPUT" == "true" ]]; then
          check_ran=true
          run_doctor "check" "${args[@]}" "${history_args[@]}" --no-animations

          if [[ "${JSON_INPUT}" == "true" ]]; then
            run_doctor "json report" "${args[@]}" --json --output "$json_path"
          fi

          if [[ "${MARKDOWN_INPUT}" == "true" ]]; then
            run_doctor "markdown summary" "${args[@]}" --markdown --output "$summary_path"
          fi

          if [[ "${SARIF_INPUT}" == "true" ]]; then
            run_doctor "sarif report" "${args[@]}" --sarif --output "$sarif_path"
          fi
        elif [[ "$CHECK_INPUT" != "false" ]]; then
          echo "check must be true or false." >&2
          record_status 2
        elif [[ -z "$SNAPSHOT_URL_INPUT" && -z "$SNAPSHOT_SERVER_INPUT" && -z "$TOOLS_CAPTURE_URL_INPUT" && -z "$TOOLS_CAPTURE_SERVER_INPUT" && -z "$TOOLS_DIFF_BEFORE_INPUT" && -z "$TOOLS_DIFF_AFTER_INPUT" && -z "$PROMPTS_CAPTURE_URL_INPUT" && -z "$PROMPTS_CAPTURE_SERVER_INPUT" && -z "$PROMPTS_DIFF_BEFORE_INPUT" && -z "$PROMPTS_DIFF_AFTER_INPUT" && -z "$RESOURCE_TEMPLATES_CAPTURE_URL_INPUT" && -z "$RESOURCE_TEMPLATES_CAPTURE_SERVER_INPUT" && -z "$RESOURCE_TEMPLATES_DIFF_BEFORE_INPUT" && -z "$RESOURCE_TEMPLATES_DIFF_AFTER_INPUT" && -z "$REGISTRY_METADATA_INPUT" && "$SUBMISSION_INPUT" != "true" && -z "$SUBMISSION_ARCHIVE_INPUT" && "${CORPUS_INPUT}" != "true" && -z "$CORPUS_METRICS_MANIFEST_INPUT" && "${CONTRACT_INPUT}" != "true" && "${REVIEW_BUNDLE_INPUT}" != "true" ]]; then
          echo "check: false requires another Action mode." >&2
          record_status 2
        fi

        if [[ "${CORPUS_INPUT}" == "true" ]]; then
          run_doctor "validation corpus" doctor corpus --json --output "$validation_corpus_path"
        fi

        if [[ -z "$CORPUS_METRICS_MANIFEST_INPUT" ]]; then
          if [[ -n "$CORPUS_METRICS_BASELINE_INPUT" || "$CORPUS_METRICS_FAIL_ON_REGRESSION_INPUT" == "true" ]]; then
            echo "Corpus metrics baseline and regression gating require corpus-metrics-manifest."
            record_status 2
          fi
        elif [[ -z "$CORPUS_METRICS_BASELINE_INPUT" && "$CORPUS_METRICS_FAIL_ON_REGRESSION_INPUT" == "true" ]]; then
          echo "corpus-metrics-fail-on-regression requires corpus-metrics-baseline."
          record_status 2
        else
          run_doctor "corpus metrics" doctor corpus metrics --manifest "$CORPUS_METRICS_MANIFEST_INPUT" --json --output "$corpus_metrics_path"

          if [[ -n "$CORPUS_METRICS_BASELINE_INPUT" && -f "$corpus_metrics_path" ]]; then
            corpus_metrics_diff_args=(doctor corpus metrics diff --before "$CORPUS_METRICS_BASELINE_INPUT" --after "$corpus_metrics_path" --json --output "$corpus_metrics_diff_path")

            if [[ "$CORPUS_METRICS_FAIL_ON_REGRESSION_INPUT" == "true" ]]; then
              corpus_metrics_diff_args+=(--fail-on-regression)
            fi

            run_doctor "corpus metrics regression" "${corpus_metrics_diff_args[@]}"
          fi
        fi

        if [[ "${CONTRACT_INPUT}" == "true" ]]; then
          run_doctor "output contract" doctor contract --json --output "$output_contract_path"
        fi

        if [[ -z "$REGISTRY_METADATA_INPUT" ]]; then
          if [[ "$REQUIRE_REGISTRY_READINESS_INPUT" == "true" ]]; then
            echo "require-registry-readiness requires registry-metadata."
            record_status 2
          fi
        else
          registry_args=(registry check "$REGISTRY_METADATA_INPUT" --json --output "$registry_report_path")
          if [[ "$REQUIRE_REGISTRY_READINESS_INPUT" == "true" ]]; then
            registry_args+=(--require-registry-readiness)
          fi
          run_doctor "MCP Registry readiness" "${registry_args[@]}"
        fi

        # Captures and compares one definition list. Arguments: kind (tools, prompts, or resource-templates),
        # var (the kind as a bash name), noun (tool, prompt, or resource template), title (as in the Markdown
        # heading), then that kind's capture url, server, sandbox, env names, defer findings, and token env
        # inputs, its diff before, after, and fail-on inputs, and the file a snapshot saved for it, or "" when
        # no snapshot ran. Sets <var>_capture_output, <var>_diff_ran, <var>_diff_json_output, and
        # <var>_diff_summary_output.
        capture_and_diff() {
          local kind="$1" var="$2" noun="$3" title="$4" url="$5" server="$6" sandbox="$7" env_input="$8" defer="$9"
          local token_env="${10}" before="${11}" after="${12}" fail_on="${13}" snapshot_file="${14}"
          local capture_path="$report_dir/mcp-$kind-current.json"
          local diff_json_path="$report_dir/mcp-$kind-diff.json"
          local diff_summary_path="$report_dir/mcp-$kind-diff.md"
          local capture_output="" diff_after="$after" capture_feeds_diff=false
          local capture_args=() env_names=() name code diff_args diff_code diff_markdown
          if [[ ( -n "$url" || -n "$server" || -n "$snapshot_file" ) && -n "$before" && -z "$after" ]]; then
            capture_feeds_diff=true
          fi
          # A snapshot earlier in this step saved the list when the server offered it and it was complete.
          if [[ -n "$snapshot_file" && -f "$snapshot_file" ]]; then
            capture_output="$snapshot_file"
          fi

          if [[ -z "$url" && -n "$token_env" ]]; then
            echo "$kind-capture-token-env requires $kind-capture-url." >&2
            record_status 2
          fi

          if [[ -n "$server" ]]; then
            # Starting a stdio server runs package code, so it needs the same consent as runtime probing.
            if [[ "$RUNTIME_INPUT" != "true" ]]; then
              echo "$kind-capture-server requires runtime: true." >&2
              record_status 2
            else
              capture_args=(doctor "$kind" "$PACKAGE_PATH_INPUT" --server "$server" --runtime --save-response "$capture_path")
              if [[ "$sandbox" == "docker" ]]; then
                capture_args+=(--sandbox docker)
                mapfile -t env_names < <(capture_env_names "$env_input")
                for name in "${env_names[@]}"; do
                  capture_args+=(--env "$name")
                done
              fi
            fi
          elif [[ -n "$url" ]]; then
            if [[ "$ALLOW_NETWORK_INPUT" != "true" ]]; then
              echo "$kind-capture-url requires allow-network: true." >&2
              record_status 2
            elif [[ -n "$token_env" && ! "$token_env" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
              echo "$kind-capture-token-env must be an environment variable name." >&2
              record_status 2
            elif [[ -n "$token_env" && -z "${!token_env:-}" ]]; then
              echo "Bearer token environment variable is not set: ${token_env}" >&2
              record_status 2
            else
              capture_args=(doctor "$kind" "$url" --allow-network --save-response "$capture_path")
              if [[ "$ALLOW_LOCAL_NETWORK_INPUT" == "true" ]]; then
                capture_args+=(--allow-local-network)
              fi
              if [[ -n "$token_env" ]]; then
                capture_args+=(--bearer-token-env "$token_env")
              fi
            fi
          fi

          if (( ${#capture_args[@]} > 0 )); then
            # Remove an earlier capture so a failed run can never be compared as the live list.
            rm -f "$capture_path"
            echo "::group::MCP $noun capture"
            set +e
            codex-plugin-doctor "${capture_args[@]}"
            code="$?"
            set -e
            echo "::endgroup::"
            # Exit 0 or 1 means the response was saved; catalog findings reach the status here only
            # when no comparison here or in a later job re-inspects the saved file.
            if [[ ( "$code" -eq 0 || "$code" -eq 1 ) && -f "$capture_path" ]]; then
              capture_output="$capture_path"
              if [[ "$capture_feeds_diff" != "true" && "$defer" != "true" ]]; then
                record_status "$code"
              fi
            else
              echo "Codex Plugin Doctor MCP $noun capture did not save a response (status ${code})."
              record_status 2
            fi
          fi
          printf -v "${var}_capture_output" '%s' "$capture_output"

          if [[ "$capture_feeds_diff" == "true" ]]; then
            diff_after="$capture_output"
          fi

          if [[ -z "$before" && -z "$after" ]]; then
            :
          elif [[ "$capture_feeds_diff" == "true" && -z "$diff_after" ]]; then
            echo "MCP $noun diff skipped because no $noun list was captured." >&2
            record_status 2
          elif [[ -z "$before" || -z "$diff_after" ]]; then
            echo "$kind-diff-before and $kind-diff-after must be set together." >&2
            record_status 2
          elif [[ "$fail_on" != "any" && "$fail_on" != "breaking" ]]; then
            echo "$kind-diff-fail-on must be any or breaking." >&2
            record_status 2
          else
            printf -v "${var}_diff_ran" '%s' true
            diff_args=(doctor "$kind-diff" --before "$before" --after "$diff_after" --fail-on "$fail_on")
            echo "::group::MCP $noun diff"
            set +e
            codex-plugin-doctor "${diff_args[@]}" --json > "$diff_json_path"
            diff_code="$?"
            diff_markdown="$(codex-plugin-doctor "${diff_args[@]}" --markdown 2>/dev/null)"
            # Older CLI versions pinned through the version input have no --markdown; fall back to text.
            if [[ "$diff_markdown" != "## MCP $title Definition Diff"* ]]; then
              diff_markdown="$(printf '## MCP %s Definition Diff\n\n```text\n%s\n```' "$title" "$(codex-plugin-doctor "${diff_args[@]}")")"
            fi
            set -e
            printf '%s\n' "$diff_markdown"
            {
              printf '%s\n' "$diff_markdown"
              echo ""
              echo "- Exit status: ${diff_code}"
              echo "- Fail on: ${fail_on}"
            } > "$diff_summary_path"
            if [[ "$diff_code" -ne 0 ]]; then
              echo "Codex Plugin Doctor MCP $noun diff exited with status ${diff_code}."
            fi
            echo "::endgroup::"
            record_status "$diff_code"
            printf -v "${var}_diff_json_output" '%s' "$diff_json_path"
            printf -v "${var}_diff_summary_output" '%s' "$diff_summary_path"
          fi
        }

        # A snapshot reads every list in one server session and saves the complete ones under the names the
        # per-kind captures use. Succeeds when the snapshot saved a kind's list and no comparison in this
        # step re-checks it. Arguments: kind, that kind's diff before and after inputs.
        snapshot_unchecked() {
          [[ -f "$report_dir/mcp-$1-current.json" && ( -z "$2" || -n "$3" ) ]]
        }
        snapshot_ran=false
        if [[ -n "$SNAPSHOT_SERVER_INPUT" || -n "$SNAPSHOT_URL_INPUT" ]]; then
          snapshot_args=()
          if [[ -n "$SNAPSHOT_SERVER_INPUT" ]]; then
            if [[ "$RUNTIME_INPUT" != "true" ]]; then
              echo "snapshot-server requires runtime: true." >&2
              record_status 2
            else
              snapshot_args=(doctor mcp-snapshot "$PACKAGE_PATH_INPUT" --server "$SNAPSHOT_SERVER_INPUT" --runtime --save-dir "$report_dir")
              if [[ "$SNAPSHOT_SANDBOX_INPUT" == "docker" ]]; then
                snapshot_args+=(--sandbox docker)
                mapfile -t snapshot_env_names < <(capture_env_names "$SNAPSHOT_ENV_INPUT")
                for name in "${snapshot_env_names[@]}"; do
                  snapshot_args+=(--env "$name")
                done
              fi
            fi
          elif [[ "$ALLOW_NETWORK_INPUT" != "true" ]]; then
            echo "snapshot-url requires allow-network: true." >&2
            record_status 2
          elif [[ -n "$SNAPSHOT_TOKEN_ENV_INPUT" && ! "$SNAPSHOT_TOKEN_ENV_INPUT" =~ ^[A-Za-z_][A-Za-z0-9_]*$ ]]; then
            echo "snapshot-token-env must be an environment variable name." >&2
            record_status 2
          elif [[ -n "$SNAPSHOT_TOKEN_ENV_INPUT" && -z "${!SNAPSHOT_TOKEN_ENV_INPUT:-}" ]]; then
            echo "Bearer token environment variable is not set: ${SNAPSHOT_TOKEN_ENV_INPUT}" >&2
            record_status 2
          else
            snapshot_args=(doctor mcp-snapshot "$SNAPSHOT_URL_INPUT" --allow-network --save-dir "$report_dir")
            if [[ "$ALLOW_LOCAL_NETWORK_INPUT" == "true" ]]; then
              snapshot_args+=(--allow-local-network)
            fi
            if [[ -n "$SNAPSHOT_TOKEN_ENV_INPUT" ]]; then
              snapshot_args+=(--bearer-token-env "$SNAPSHOT_TOKEN_ENV_INPUT")
            fi
          fi
          if (( ${#snapshot_args[@]} > 0 )); then
            # Remove earlier captures so a list that is not saved now can never be compared as the live one.
            rm -f "$report_dir/mcp-tools-current.json" "$report_dir/mcp-prompts-current.json" "$report_dir/mcp-resource-templates-current.json"
            echo "::group::MCP snapshot"
            set +e
            codex-plugin-doctor "${snapshot_args[@]}"
            snapshot_code="$?"
            set -e
            echo "::endgroup::"
            snapshot_ran=true
            if [[ "$snapshot_code" -ne 0 && "$snapshot_code" -ne 1 ]]; then
              echo "Codex Plugin Doctor MCP snapshot did not read every list the server offers completely (status ${snapshot_code})."
              record_status 2
            elif [[ ! -f "$report_dir/mcp-tools-current.json" && ! -f "$report_dir/mcp-prompts-current.json" && ! -f "$report_dir/mcp-resource-templates-current.json" ]]; then
              echo "Codex Plugin Doctor MCP snapshot saved no list (status ${snapshot_code})."
              record_status 2
            elif [[ "$SNAPSHOT_DEFER_FINDINGS_INPUT" == "true" ]]; then
              :
            # Findings reach the status here unless every saved list feeds a comparison that re-checks it.
            elif snapshot_unchecked tools "$TOOLS_DIFF_BEFORE_INPUT" "$TOOLS_DIFF_AFTER_INPUT" \
              || snapshot_unchecked prompts "$PROMPTS_DIFF_BEFORE_INPUT" "$PROMPTS_DIFF_AFTER_INPUT" \
              || snapshot_unchecked resource-templates "$RESOURCE_TEMPLATES_DIFF_BEFORE_INPUT" "$RESOURCE_TEMPLATES_DIFF_AFTER_INPUT"; then
              record_status "$snapshot_code"
            fi
          fi
        elif [[ -n "$SNAPSHOT_TOKEN_ENV_INPUT" ]]; then
          echo "snapshot-token-env requires snapshot-url." >&2
          record_status 2
        fi
        snapshot_file() {
          if [[ "$snapshot_ran" == "true" ]]; then printf '%s' "$report_dir/mcp-$1-current.json"; fi
        }

        capture_and_diff tools tools tool Tool "$TOOLS_CAPTURE_URL_INPUT" "$TOOLS_CAPTURE_SERVER_INPUT" "$TOOLS_CAPTURE_SANDBOX_INPUT" \
          "$TOOLS_CAPTURE_ENV_INPUT" "$TOOLS_CAPTURE_DEFER_FINDINGS_INPUT" "$TOOLS_CAPTURE_TOKEN_ENV_INPUT" \
          "$TOOLS_DIFF_BEFORE_INPUT" "$TOOLS_DIFF_AFTER_INPUT" "$TOOLS_DIFF_FAIL_ON_INPUT" "$(snapshot_file tools)"
        capture_and_diff prompts prompts prompt Prompt "$PROMPTS_CAPTURE_URL_INPUT" "$PROMPTS_CAPTURE_SERVER_INPUT" "$PROMPTS_CAPTURE_SANDBOX_INPUT" \
          "$PROMPTS_CAPTURE_ENV_INPUT" "$PROMPTS_CAPTURE_DEFER_FINDINGS_INPUT" "$PROMPTS_CAPTURE_TOKEN_ENV_INPUT" \
          "$PROMPTS_DIFF_BEFORE_INPUT" "$PROMPTS_DIFF_AFTER_INPUT" "$PROMPTS_DIFF_FAIL_ON_INPUT" "$(snapshot_file prompts)"
        capture_and_diff resource-templates resource_templates "resource template" "Resource Template" \
          "$RESOURCE_TEMPLATES_CAPTURE_URL_INPUT" "$RESOURCE_TEMPLATES_CAPTURE_SERVER_INPUT" "$RESOURCE_TEMPLATES_CAPTURE_SANDBOX_INPUT" \
          "$RESOURCE_TEMPLATES_CAPTURE_ENV_INPUT" "$RESOURCE_TEMPLATES_CAPTURE_DEFER_FINDINGS_INPUT" "$RESOURCE_TEMPLATES_CAPTURE_TOKEN_ENV_INPUT" \
          "$RESOURCE_TEMPLATES_DIFF_BEFORE_INPUT" "$RESOURCE_TEMPLATES_DIFF_AFTER_INPUT" "$RESOURCE_TEMPLATES_DIFF_FAIL_ON_INPUT" \
          "$(snapshot_file resource-templates)"

        if [[ "$SUBMISSION_INPUT" == "true" && -n "$SUBMISSION_ARCHIVE_INPUT" ]]; then
          echo "submission and submission-archive cannot be selected together." >&2
          record_status 2
        elif [[ "$REQUIRE_SUBMISSION_READY_INPUT" == "true" && "$SUBMISSION_INPUT" != "true" && -z "$SUBMISSION_ARCHIVE_INPUT" ]]; then
          echo "require-submission-ready requires exactly one submission mode." >&2
          record_status 2
        elif [[ "$SUBMISSION_INPUT" == "true" && "${INSTALLED_INPUT}" == "true" ]]; then
          echo "Submission preflight requires a single package path, not installed-cache mode." >&2
          record_status 2
        elif [[ "$SUBMISSION_INPUT" == "true" ]]; then
          submission_ran=true
          submission_args=(doctor submission "${PACKAGE_PATH_INPUT}" --json --output "$submission_json_path")
          if [[ "$REQUIRE_SUBMISSION_READY_INPUT" == "true" ]]; then
            submission_args+=(--require-ready)
          fi
          run_doctor "submission preflight" "${submission_args[@]}"
          run_doctor "submission summary" doctor submission "${PACKAGE_PATH_INPUT}" --markdown --output "$submission_summary_path"
          submission_json_output="$submission_json_path"
          submission_summary_output="$submission_summary_path"
        elif [[ -n "$SUBMISSION_ARCHIVE_INPUT" ]]; then
          submission_archive_ran=true
          submission_archive_args=(doctor submission archive "$SUBMISSION_ARCHIVE_INPUT" --json --output "$submission_archive_json_path")
          if [[ "$REQUIRE_SUBMISSION_READY_INPUT" == "true" ]]; then
            submission_archive_args+=(--require-ready)
          fi
          run_doctor "submission archive preflight" "${submission_archive_args[@]}"
          run_doctor "submission archive summary" doctor submission archive "$SUBMISSION_ARCHIVE_INPUT" --markdown --output "$submission_archive_summary_path"
          submission_archive_json_output="$submission_archive_json_path"
          submission_archive_summary_output="$submission_archive_summary_path"
        fi

        if [[ "${REVIEW_BUNDLE_INPUT}" == "true" ]]; then
          signing_key_env="${SIGNING_KEY_ENV_INPUT}"

          if [[ "${INSTALLED_INPUT}" == "true" ]]; then
            echo "Review bundle generation requires a single package path, not installed-cache mode."
            record_status 2
          elif [[ -z "$signing_key_env" ]]; then
            echo "Review bundle generation requires signing-key-env."
            record_status 2
          elif [[ -z "${!signing_key_env:-}" ]]; then
            echo "Review bundle signing key environment variable is not set: ${signing_key_env}"
            record_status 2
          else
            review_bundle_args=(doctor review-bundle "${PACKAGE_PATH_INPUT}" --output "$review_bundle_path" --sign-key-env "$signing_key_env")

            if [[ "${REVIEW_BUNDLE_ALLOW_DIRTY_INPUT}" == "true" ]]; then
              review_bundle_args+=(--allow-dirty)
            fi

            if [[ "${REVIEW_BUNDLE_ALLOW_UNTAGGED_INPUT}" == "true" ]]; then
              review_bundle_args+=(--allow-untagged)
            fi

            run_doctor "review bundle" "${review_bundle_args[@]}"

            if [[ "${REVIEW_BUNDLE_VERIFY_INPUT}" == "true" ]]; then
              run_doctor "review bundle verification" doctor review-bundle verify "$review_bundle_path" --target "${PACKAGE_PATH_INPUT}" --sign-key-env "$signing_key_env" --json --output "$review_bundle_verification_path"
            fi
          fi
        fi

        export CODEX_PLUGIN_DOCTOR_ACTION_MANIFEST_PATH="$action_manifest_path"
        export CODEX_PLUGIN_DOCTOR_ACTION_STATUS="$status"
        export CODEX_PLUGIN_DOCTOR_ACTION_VERSION="$doctor_version"
        export CODEX_PLUGIN_DOCTOR_ACTION_REPORT_DIR="$report_dir"
        export CODEX_PLUGIN_DOCTOR_ACTION_ARTIFACT_NAME="${ARTIFACT_NAME_INPUT}"
        export CODEX_PLUGIN_DOCTOR_ACTION_PATH="${PACKAGE_PATH_INPUT}"
        export CODEX_PLUGIN_DOCTOR_ACTION_INSTALLED="${INSTALLED_INPUT}"
        export CODEX_PLUGIN_DOCTOR_ACTION_RUNTIME="$([[ "$check_ran" == "true" && "${RUNTIME_INPUT}" == "true" ]] && echo true || echo false)"
        export CODEX_PLUGIN_DOCTOR_ACTION_CHECK="$check_ran"
        export CODEX_PLUGIN_DOCTOR_ACTION_JSON="$([[ "$check_ran" == "true" && "${JSON_INPUT}" == "true" ]] && echo true || echo false)"
        export CODEX_PLUGIN_DOCTOR_ACTION_MARKDOWN="$([[ "$check_ran" == "true" && "${MARKDOWN_INPUT}" == "true" ]] && echo true || echo false)"
        export CODEX_PLUGIN_DOCTOR_ACTION_SARIF="$([[ "$check_ran" == "true" && "${SARIF_INPUT}" == "true" ]] && echo true || echo false)"
        export CODEX_PLUGIN_DOCTOR_ACTION_CORPUS="${CORPUS_INPUT}"
        export CODEX_PLUGIN_DOCTOR_ACTION_CORPUS_METRICS="$([[ -n "$CORPUS_METRICS_MANIFEST_INPUT" ]] && echo true || echo false)"
        export CODEX_PLUGIN_DOCTOR_ACTION_CORPUS_METRICS_DIFF="$([[ -n "$CORPUS_METRICS_BASELINE_INPUT" ]] && echo true || echo false)"
        export CODEX_PLUGIN_DOCTOR_ACTION_CONTRACT="${CONTRACT_INPUT}"
        export CODEX_PLUGIN_DOCTOR_ACTION_REGISTRY="$([[ -n "$REGISTRY_METADATA_INPUT" ]] && echo true || echo false)"
        export CODEX_PLUGIN_DOCTOR_ACTION_SUBMISSION="$submission_ran"
        export CODEX_PLUGIN_DOCTOR_ACTION_SUBMISSION_ARCHIVE="$submission_archive_ran"
        export CODEX_PLUGIN_DOCTOR_ACTION_TOOLS_CAPTURE="$([[ -n "$tools_capture_output" ]] && echo true || echo false)"
        export CODEX_PLUGIN_DOCTOR_ACTION_TOOLS_CAPTURE_PATH="$tools_capture_output"
        export CODEX_PLUGIN_DOCTOR_ACTION_TOOLS_DIFF="$tools_diff_ran"
        export CODEX_PLUGIN_DOCTOR_ACTION_PROMPTS_CAPTURE="$([[ -n "$prompts_capture_output" ]] && echo true || echo false)"
        export CODEX_PLUGIN_DOCTOR_ACTION_PROMPTS_CAPTURE_PATH="$prompts_capture_output"
        export CODEX_PLUGIN_DOCTOR_ACTION_PROMPTS_DIFF="$prompts_diff_ran"
        export CODEX_PLUGIN_DOCTOR_ACTION_RESOURCE_TEMPLATES_CAPTURE="$([[ -n "$resource_templates_capture_output" ]] && echo true || echo false)"
        export CODEX_PLUGIN_DOCTOR_ACTION_RESOURCE_TEMPLATES_CAPTURE_PATH="$resource_templates_capture_output"
        export CODEX_PLUGIN_DOCTOR_ACTION_RESOURCE_TEMPLATES_DIFF="$resource_templates_diff_ran"
        export CODEX_PLUGIN_DOCTOR_ACTION_REVIEW_BUNDLE="${REVIEW_BUNDLE_INPUT}"
        export CODEX_PLUGIN_DOCTOR_ACTION_REVIEW_BUNDLE_VERIFY="${REVIEW_BUNDLE_VERIFY_INPUT}"
        export CODEX_PLUGIN_DOCTOR_ACTION_SUMMARY_PATH="$summary_path"
        export CODEX_PLUGIN_DOCTOR_ACTION_JSON_PATH="$json_path"
        export CODEX_PLUGIN_DOCTOR_ACTION_SARIF_PATH="$sarif_path"
        export CODEX_PLUGIN_DOCTOR_ACTION_CORPUS_PATH="$validation_corpus_path"
        export CODEX_PLUGIN_DOCTOR_ACTION_CORPUS_METRICS_PATH="$corpus_metrics_path"
        export CODEX_PLUGIN_DOCTOR_ACTION_CORPUS_METRICS_DIFF_PATH="$corpus_metrics_diff_path"
        export CODEX_PLUGIN_DOCTOR_ACTION_CONTRACT_PATH="$output_contract_path"
        export CODEX_PLUGIN_DOCTOR_ACTION_REGISTRY_PATH="$registry_report_path"
        export CODEX_PLUGIN_DOCTOR_ACTION_SUBMISSION_JSON_PATH="$submission_json_output"
        export CODEX_PLUGIN_DOCTOR_ACTION_SUBMISSION_SUMMARY_PATH="$submission_summary_output"
        export CODEX_PLUGIN_DOCTOR_ACTION_SUBMISSION_ARCHIVE_JSON_PATH="$submission_archive_json_output"
        export CODEX_PLUGIN_DOCTOR_ACTION_SUBMISSION_ARCHIVE_SUMMARY_PATH="$submission_archive_summary_output"
        export CODEX_PLUGIN_DOCTOR_ACTION_TOOLS_DIFF_JSON_PATH="$tools_diff_json_output"
        export CODEX_PLUGIN_DOCTOR_ACTION_TOOLS_DIFF_SUMMARY_PATH="$tools_diff_summary_output"
        export CODEX_PLUGIN_DOCTOR_ACTION_PROMPTS_DIFF_JSON_PATH="$prompts_diff_json_output"
        export CODEX_PLUGIN_DOCTOR_ACTION_PROMPTS_DIFF_SUMMARY_PATH="$prompts_diff_summary_output"
        export CODEX_PLUGIN_DOCTOR_ACTION_RESOURCE_TEMPLATES_DIFF_JSON_PATH="$resource_templates_diff_json_output"
        export CODEX_PLUGIN_DOCTOR_ACTION_RESOURCE_TEMPLATES_DIFF_SUMMARY_PATH="$resource_templates_diff_summary_output"
        export CODEX_PLUGIN_DOCTOR_ACTION_REVIEW_BUNDLE_PATH="$review_bundle_path"
        export CODEX_PLUGIN_DOCTOR_ACTION_REVIEW_BUNDLE_VERIFICATION_PATH="$review_bundle_verification_path"
        node <<'NODE'
        const fs = require("node:fs");
        const path = require("node:path");

        const enabled = (name) => process.env[name] === "true";
        const displayTargetPath = (value) => {
          if (/^file:/iu.test(value) || path.isAbsolute(value) || path.win32.isAbsolute(value)) return "[absolute-path-redacted]";
          return value === "" ? "" : path.posix.normalize(value.replace(/\\/gu, "/"));
        };
        const report = (key, enabledEnv, pathEnv) => ({
          enabled: enabled(enabledEnv),
          path: process.env[pathEnv] || ""
        });
        const manifest = {
          schemaVersion: "1.0.0",
          kind: "doctor.github.action.manifest",
          generatedAt: new Date().toISOString(),
          version: process.env.CODEX_PLUGIN_DOCTOR_ACTION_VERSION || "",
          status: Number(process.env.CODEX_PLUGIN_DOCTOR_ACTION_STATUS || "1"),
          reportDirectory: process.env.CODEX_PLUGIN_DOCTOR_ACTION_REPORT_DIR || "",
          artifactName: process.env.CODEX_PLUGIN_DOCTOR_ACTION_ARTIFACT_NAME || "",
          target: {
            path: displayTargetPath(process.env.CODEX_PLUGIN_DOCTOR_ACTION_PATH || ""),
            installed: enabled("CODEX_PLUGIN_DOCTOR_ACTION_INSTALLED"),
            runtime: enabled("CODEX_PLUGIN_DOCTOR_ACTION_RUNTIME"),
            check: enabled("CODEX_PLUGIN_DOCTOR_ACTION_CHECK")
          },
          reports: {
            summary: report("summary", "CODEX_PLUGIN_DOCTOR_ACTION_MARKDOWN", "CODEX_PLUGIN_DOCTOR_ACTION_SUMMARY_PATH"),
            json: report("json", "CODEX_PLUGIN_DOCTOR_ACTION_JSON", "CODEX_PLUGIN_DOCTOR_ACTION_JSON_PATH"),
            sarif: report("sarif", "CODEX_PLUGIN_DOCTOR_ACTION_SARIF", "CODEX_PLUGIN_DOCTOR_ACTION_SARIF_PATH"),
            corpus: report("corpus", "CODEX_PLUGIN_DOCTOR_ACTION_CORPUS", "CODEX_PLUGIN_DOCTOR_ACTION_CORPUS_PATH"),
            corpusMetrics: report("corpusMetrics", "CODEX_PLUGIN_DOCTOR_ACTION_CORPUS_METRICS", "CODEX_PLUGIN_DOCTOR_ACTION_CORPUS_METRICS_PATH"),
            corpusMetricsDiff: report("corpusMetricsDiff", "CODEX_PLUGIN_DOCTOR_ACTION_CORPUS_METRICS_DIFF", "CODEX_PLUGIN_DOCTOR_ACTION_CORPUS_METRICS_DIFF_PATH"),
            contract: report("contract", "CODEX_PLUGIN_DOCTOR_ACTION_CONTRACT", "CODEX_PLUGIN_DOCTOR_ACTION_CONTRACT_PATH"),
            registryReport: report("registryReport", "CODEX_PLUGIN_DOCTOR_ACTION_REGISTRY", "CODEX_PLUGIN_DOCTOR_ACTION_REGISTRY_PATH"),
            submissionJson: report("submissionJson", "CODEX_PLUGIN_DOCTOR_ACTION_SUBMISSION", "CODEX_PLUGIN_DOCTOR_ACTION_SUBMISSION_JSON_PATH"),
            submissionSummary: report("submissionSummary", "CODEX_PLUGIN_DOCTOR_ACTION_SUBMISSION", "CODEX_PLUGIN_DOCTOR_ACTION_SUBMISSION_SUMMARY_PATH"),
            submissionArchiveJson: report("submissionArchiveJson", "CODEX_PLUGIN_DOCTOR_ACTION_SUBMISSION_ARCHIVE", "CODEX_PLUGIN_DOCTOR_ACTION_SUBMISSION_ARCHIVE_JSON_PATH"),
            submissionArchiveSummary: report("submissionArchiveSummary", "CODEX_PLUGIN_DOCTOR_ACTION_SUBMISSION_ARCHIVE", "CODEX_PLUGIN_DOCTOR_ACTION_SUBMISSION_ARCHIVE_SUMMARY_PATH"),
            toolsCapture: report("toolsCapture", "CODEX_PLUGIN_DOCTOR_ACTION_TOOLS_CAPTURE", "CODEX_PLUGIN_DOCTOR_ACTION_TOOLS_CAPTURE_PATH"),
            toolsDiffJson: report("toolsDiffJson", "CODEX_PLUGIN_DOCTOR_ACTION_TOOLS_DIFF", "CODEX_PLUGIN_DOCTOR_ACTION_TOOLS_DIFF_JSON_PATH"),
            toolsDiffSummary: report("toolsDiffSummary", "CODEX_PLUGIN_DOCTOR_ACTION_TOOLS_DIFF", "CODEX_PLUGIN_DOCTOR_ACTION_TOOLS_DIFF_SUMMARY_PATH"),
            promptsCapture: report("promptsCapture", "CODEX_PLUGIN_DOCTOR_ACTION_PROMPTS_CAPTURE", "CODEX_PLUGIN_DOCTOR_ACTION_PROMPTS_CAPTURE_PATH"),
            promptsDiffJson: report("promptsDiffJson", "CODEX_PLUGIN_DOCTOR_ACTION_PROMPTS_DIFF", "CODEX_PLUGIN_DOCTOR_ACTION_PROMPTS_DIFF_JSON_PATH"),
            promptsDiffSummary: report("promptsDiffSummary", "CODEX_PLUGIN_DOCTOR_ACTION_PROMPTS_DIFF", "CODEX_PLUGIN_DOCTOR_ACTION_PROMPTS_DIFF_SUMMARY_PATH"),
            resourceTemplatesCapture: report("resourceTemplatesCapture", "CODEX_PLUGIN_DOCTOR_ACTION_RESOURCE_TEMPLATES_CAPTURE", "CODEX_PLUGIN_DOCTOR_ACTION_RESOURCE_TEMPLATES_CAPTURE_PATH"),
            resourceTemplatesDiffJson: report("resourceTemplatesDiffJson", "CODEX_PLUGIN_DOCTOR_ACTION_RESOURCE_TEMPLATES_DIFF", "CODEX_PLUGIN_DOCTOR_ACTION_RESOURCE_TEMPLATES_DIFF_JSON_PATH"),
            resourceTemplatesDiffSummary: report("resourceTemplatesDiffSummary", "CODEX_PLUGIN_DOCTOR_ACTION_RESOURCE_TEMPLATES_DIFF", "CODEX_PLUGIN_DOCTOR_ACTION_RESOURCE_TEMPLATES_DIFF_SUMMARY_PATH"),
            reviewBundle: report("reviewBundle", "CODEX_PLUGIN_DOCTOR_ACTION_REVIEW_BUNDLE", "CODEX_PLUGIN_DOCTOR_ACTION_REVIEW_BUNDLE_PATH"),
            reviewBundleVerification: report("reviewBundleVerification", "CODEX_PLUGIN_DOCTOR_ACTION_REVIEW_BUNDLE_VERIFY", "CODEX_PLUGIN_DOCTOR_ACTION_REVIEW_BUNDLE_VERIFICATION_PATH")
          }
        };

        fs.writeFileSync(
          process.env.CODEX_PLUGIN_DOCTOR_ACTION_MANIFEST_PATH,
          `${JSON.stringify(manifest, null, 2)}\n`,
          "utf8"
        );
        NODE

        printf "%s" "$status" > "$status_file"
        printf "%s" "$submission_ran" > "$submission_state_file"
        printf "%s" "$submission_archive_ran" > "$submission_archive_state_file"
        printf "%s" "$tools_diff_ran" > "$tools_diff_state_file"
        printf "%s" "$prompts_diff_ran" > "$prompts_diff_state_file"
        printf "%s" "$resource_templates_diff_ran" > "$resource_templates_diff_state_file"
        printf "%s" "$check_ran" > "$check_state_file"

        {
          echo "status=$status"
          echo "report-dir=$report_dir"
          echo "summary-path=$([[ "$check_ran" == "true" ]] && echo "$summary_path")"
          echo "json-path=$([[ "$check_ran" == "true" ]] && echo "$json_path")"
          echo "sarif-path=$([[ "$check_ran" == "true" ]] && echo "$sarif_path")"
          echo "validation-corpus-path=$validation_corpus_path"
          echo "corpus-metrics-path=$corpus_metrics_path"
          echo "corpus-metrics-diff-path=$corpus_metrics_diff_path"
          echo "output-contract-path=$output_contract_path"
          echo "action-manifest-path=$action_manifest_path"
          echo "registry-report-path=$registry_report_path"
          echo "submission-json-path=$submission_json_output"
          echo "submission-summary-path=$submission_summary_output"
          echo "submission-archive-json-path=$submission_archive_json_output"
          echo "submission-archive-summary-path=$submission_archive_summary_output"
          echo "tools-capture-path=$tools_capture_output"
          echo "tools-diff-json-path=$tools_diff_json_output"
          echo "tools-diff-summary-path=$tools_diff_summary_output"
          echo "prompts-capture-path=$prompts_capture_output"
          echo "prompts-diff-json-path=$prompts_diff_json_output"
          echo "prompts-diff-summary-path=$prompts_diff_summary_output"
          echo "resource-templates-capture-path=$resource_templates_capture_output"
          echo "resource-templates-diff-json-path=$resource_templates_diff_json_output"
          echo "resource-templates-diff-summary-path=$resource_templates_diff_summary_output"
          echo "review-bundle-path=$review_bundle_path"
          echo "review-bundle-verification-path=$review_bundle_verification_path"
        } >> "$GITHUB_OUTPUT"

    - name: Publish Codex Plugin Doctor summary
      if: ${{ always() && inputs['step-summary'] == 'true' }}
      shell: bash
      env:
        OUTPUT_DIR_INPUT: ${{ inputs['output-dir'] }}
      run: |
        set -euo pipefail

        report_dir="${OUTPUT_DIR_INPUT}"
        summary_path="$report_dir/codex-plugin-doctor-summary.md"
        submission_summary_path="$report_dir/codex-plugin-doctor-submission.md"
        submission_archive_summary_path="$report_dir/codex-plugin-doctor-submission-archive.md"
        tools_diff_summary_path="$report_dir/mcp-tools-diff.md"
        prompts_diff_summary_path="$report_dir/mcp-prompts-diff.md"
        resource_templates_diff_summary_path="$report_dir/mcp-resource-templates-diff.md"
        status_file="${RUNNER_TEMP:-.}/codex-plugin-doctor-status"
        submission_state_file="${RUNNER_TEMP:-.}/codex-plugin-doctor-submission-ran"
        submission_archive_state_file="${RUNNER_TEMP:-.}/codex-plugin-doctor-submission-archive-ran"
        tools_diff_state_file="${RUNNER_TEMP:-.}/codex-plugin-doctor-tools-diff-ran"
        prompts_diff_state_file="${RUNNER_TEMP:-.}/codex-plugin-doctor-prompts-diff-ran"
        resource_templates_diff_state_file="${RUNNER_TEMP:-.}/codex-plugin-doctor-resource-templates-diff-ran"
        check_state_file="${RUNNER_TEMP:-.}/codex-plugin-doctor-check-ran"
        status="unknown"
        submission_ran=false
        submission_archive_ran=false
        tools_diff_ran=false
        prompts_diff_ran=false
        resource_templates_diff_ran=false
        check_ran=false

        if [[ -f "$status_file" ]]; then
          status="$(cat "$status_file")"
        fi

        if [[ -f "$submission_state_file" ]]; then
          submission_ran="$(cat "$submission_state_file")"
        fi

        if [[ -f "$submission_archive_state_file" ]]; then
          submission_archive_ran="$(cat "$submission_archive_state_file")"
        fi

        if [[ -f "$tools_diff_state_file" ]]; then
          tools_diff_ran="$(cat "$tools_diff_state_file")"
        fi

        if [[ -f "$prompts_diff_state_file" ]]; then
          prompts_diff_ran="$(cat "$prompts_diff_state_file")"
        fi

        if [[ -f "$resource_templates_diff_state_file" ]]; then
          resource_templates_diff_ran="$(cat "$resource_templates_diff_state_file")"
        fi

        if [[ -f "$check_state_file" ]]; then
          check_ran="$(cat "$check_state_file")"
        fi

        if [[ -n "${GITHUB_STEP_SUMMARY:-}" && "$check_ran" == "true" && -f "$summary_path" ]]; then
          cat "$summary_path" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [[ -n "${GITHUB_STEP_SUMMARY:-}" && "$submission_ran" == "true" && -f "$submission_summary_path" ]]; then
          cat "$submission_summary_path" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [[ -n "${GITHUB_STEP_SUMMARY:-}" && "$submission_archive_ran" == "true" && -f "$submission_archive_summary_path" ]]; then
          cat "$submission_archive_summary_path" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [[ -n "${GITHUB_STEP_SUMMARY:-}" && "$tools_diff_ran" == "true" && -f "$tools_diff_summary_path" ]]; then
          cat "$tools_diff_summary_path" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [[ -n "${GITHUB_STEP_SUMMARY:-}" && "$prompts_diff_ran" == "true" && -f "$prompts_diff_summary_path" ]]; then
          cat "$prompts_diff_summary_path" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [[ -n "${GITHUB_STEP_SUMMARY:-}" && "$resource_templates_diff_ran" == "true" && -f "$resource_templates_diff_summary_path" ]]; then
          cat "$resource_templates_diff_summary_path" >> "$GITHUB_STEP_SUMMARY"
        fi

        if [[ -n "${GITHUB_STEP_SUMMARY:-}" && ( "$check_ran" != "true" || ! -f "$summary_path" ) && ( "$submission_ran" != "true" || ! -f "$submission_summary_path" ) && ( "$submission_archive_ran" != "true" || ! -f "$submission_archive_summary_path" ) && ( "$tools_diff_ran" != "true" || ! -f "$tools_diff_summary_path" ) && ( "$prompts_diff_ran" != "true" || ! -f "$prompts_diff_summary_path" ) && ( "$resource_templates_diff_ran" != "true" || ! -f "$resource_templates_diff_summary_path" ) ]]; then
          {
            echo "## Codex Plugin Doctor"
            echo ""
            echo "- Exit status: ${status}"
            echo "- Report directory: \`${report_dir}\`"
          } >> "$GITHUB_STEP_SUMMARY"
        fi

    # Package code started by this invocation (runtime probing, a stdio capture, or a profile or policy
    # that enables them) can change what later steps run, for example through GITHUB_PATH, on any event
    # whose token can write. The runner evaluates these conditions, so the token never reaches a step then.
    - name: Skip Codex Plugin Doctor diff comments
      if: ${{ always() && (inputs['tools-diff-comment'] == 'true' || inputs['prompts-diff-comment'] == 'true' || inputs['resource-templates-diff-comment'] == 'true') && (inputs.runtime == 'true' || inputs.profile == 'publish' || inputs.policy == 'codex-publish' || inputs.policy == 'mcp-strict') }}
      shell: bash
      run: echo "::warning::Diff comments skipped because this Action invocation ran package code or was allowed to. Compare saved tool, prompt, or resource template lists and post the comments from a separate job."

    - name: Comment Codex Plugin Doctor diffs
      if: ${{ always() && (inputs['tools-diff-comment'] == 'true' || inputs['prompts-diff-comment'] == 'true' || inputs['resource-templates-diff-comment'] == 'true') && !(inputs.runtime == 'true' || inputs.profile == 'publish' || inputs.policy == 'codex-publish' || inputs.policy == 'mcp-strict') }}
      shell: bash
      env:
        GH_TOKEN: ${{ inputs['github-token'] }}
        REPORT_DIR_INPUT: ${{ inputs['output-dir'] }}
        TOOLS_DIFF_COMMENT_INPUT: ${{ inputs['tools-diff-comment'] }}
        PROMPTS_DIFF_COMMENT_INPUT: ${{ inputs['prompts-diff-comment'] }}
        RESOURCE_TEMPLATES_DIFF_COMMENT_INPUT: ${{ inputs['resource-templates-diff-comment'] }}
      run: |
        set -euo pipefail

        # GitHub rejects comment bodies longer than 65,536 characters.
        max_summary_bytes=60000

        # Posts or updates the one marker comment of a diff that ran. Arguments: kind (tools, prompts, or
        # resource-templates), noun (tool, prompt, or resource template), and title (the noun capitalized).
        comment_diff() {
          local kind="$1" noun="$2" title="$3"
          local state_file="${RUNNER_TEMP:-.}/codex-plugin-doctor-$kind-diff-ran"
          local summary_path="$REPORT_DIR_INPUT/mcp-$kind-diff.md"
          local body_path="${RUNNER_TEMP:-.}/codex-plugin-doctor-$kind-diff-comment.md"
          local marker="<!-- codex-plugin-doctor:$kind-diff -->"
          local pull_request truncated comments_path existing

          if [[ "$(cat "$state_file" 2>/dev/null || echo false)" != "true" || ! -f "$summary_path" ]]; then
            echo "$title diff comment skipped because no $noun diff ran."
            return 0
          fi

          if [[ "${GITHUB_EVENT_NAME:-}" != "pull_request" && "${GITHUB_EVENT_NAME:-}" != "pull_request_target" ]]; then
            echo "$title diff comment skipped because the event is not a pull request."
            return 0
          fi

          if [[ "${GITHUB_SERVER_URL:-https://github.com}" != "https://github.com" ]]; then
            echo "$title diff comment skipped because it supports GitHub.com only."
            return 0
          fi

          pull_request="$(node -e 'const event = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")); const number = event.pull_request?.number; process.stdout.write(Number.isInteger(number) && number > 0 ? String(number) : "");' "${GITHUB_EVENT_PATH:-}" 2>/dev/null || true)"
          if [[ -z "$pull_request" ]]; then
            echo "$title diff comment skipped because the event has no pull request number."
            return 0
          fi

          if ! command -v gh >/dev/null 2>&1; then
            echo "::warning::Codex Plugin Doctor could not post the $noun diff comment because the GitHub CLI is not installed."
            return 0
          fi

          {
            echo "$marker"
            if [[ "$(wc -c < "$summary_path")" -gt "$max_summary_bytes" ]]; then
              truncated="$(head -c "$max_summary_bytes" "$summary_path")"
              printf '%s\n' "$truncated"
              # The text fallback wraps the diff in a code fence that the cut may leave open.
              if (( $(printf '%s\n' "$truncated" | grep -c '^```' || true) % 2 == 1 )); then
                printf '```\n'
              fi
              printf '\n_Truncated; the full diff is in mcp-%s-diff.md in the report directory._\n' "$kind"
            else
              cat "$summary_path"
            fi
          } > "$body_path"

          comments_path="repos/${GITHUB_REPOSITORY}/issues/${pull_request}/comments"
          # Only bot comments that start with the marker are updated, so people's comments are never edited.
          existing="$(gh api --paginate "$comments_path" --jq ".[] | select(.user.type == \"Bot\" and (.body | startswith(\"$marker\"))) | .id" 2>/dev/null | tail -n 1 || true)"
          if [[ "$existing" =~ ^[0-9]+$ ]] && gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F "body=@${body_path}" >/dev/null 2>&1; then
            echo "Updated the Codex Plugin Doctor $noun diff comment."
          elif gh api -X POST "$comments_path" -F "body=@${body_path}" >/dev/null 2>&1; then
            echo "Posted the Codex Plugin Doctor $noun diff comment."
          else
            echo "::warning::Codex Plugin Doctor could not post the $noun diff comment. Grant pull-requests: write to github-token; pull requests from forks receive a read-only token."
          fi
        }

        # Lowercased because the step's if: compares the flags without regard to case.
        if [[ "${TOOLS_DIFF_COMMENT_INPUT,,}" == "true" ]]; then
          comment_diff tools tool Tool
        fi
        if [[ "${PROMPTS_DIFF_COMMENT_INPUT,,}" == "true" ]]; then
          comment_diff prompts prompt Prompt
        fi
        if [[ "${RESOURCE_TEMPLATES_DIFF_COMMENT_INPUT,,}" == "true" ]]; then
          comment_diff resource-templates "resource template" "Resource template"
        fi

    - name: Upload Codex Plugin Doctor reports
      if: ${{ always() && inputs['upload-artifact'] == 'true' }}
      uses: actions/upload-artifact@v7
      env:
        FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      with:
        name: ${{ inputs['artifact-name'] }}
        path: ${{ inputs['output-dir'] }}
        if-no-files-found: ignore

    - name: Complete Codex Plugin Doctor
      if: always()
      shell: bash
      run: |
        set -euo pipefail

        status_file="${RUNNER_TEMP:-.}/codex-plugin-doctor-status"
        status=1

        if [[ -f "$status_file" ]]; then
          status="$(cat "$status_file")"
        fi

        exit "$status"
