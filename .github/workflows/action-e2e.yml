name: Action E2E

# Runs the composite Action from this checkout on a real runner with the CLI built from the same
# commit, following the two-job pattern of the workflow init-ci --tools-diff-server --snapshot-baseline-dir
# writes: a capture job that starts the example stdio server once in the Docker sandbox and saves its
# tool, prompt, and resource template lists in one snapshot, and a compare job that diffs the snapshot
# against a committed baseline snapshot and posts one comment on the pull request.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push replaces a running check, so overlapping compare jobs never race on the comment.
concurrency:
  group: action-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      image: ${{ steps.pack.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Pack the CLI
        id: pack
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cli"
          tarball="$(npm pack --silent --ignore-scripts --pack-destination "$RUNNER_TEMP/cli")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "image=$(node --input-type=module -e 'const { DOCKER_RUNTIME_IMAGE } = await import("./dist/core/runtime-sandbox.js"); process.stdout.write(DOCKER_RUNTIME_IMAGE);')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: cli-package
          path: ${{ runner.temp }}/cli
          if-no-files-found: error

  capture:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          name: cli-package
          path: ${{ runner.temp }}/cli

      # Pulling first, with retries, keeps a slow or failed registry pull from looking like a capture failure.
      - name: Pull the sandbox image
        shell: bash
        env:
          IMAGE: ${{ needs.package.outputs.image }}
        run: |
          for attempt in 1 2 3; do
            if docker pull --quiet "$IMAGE"; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1

      - name: Capture the example server in the Docker sandbox
        id: capture
        uses: ./
        with:
          version: file:${{ runner.temp }}/cli/${{ needs.package.outputs.tarball }}
          path: examples/codex-doctor-runtime
          check: "false"
          runtime: "true"
          snapshot-server: doctorRuntime
          snapshot-sandbox: docker
          snapshot-defer-findings: "true"
          output-dir: ${{ runner.temp }}/capture
          artifact-name: mcp-tools-capture

      - name: Check the capture
        shell: bash
        env:
          STATUS: ${{ steps.capture.outputs.status }}
          CAPTURE_PATH: ${{ steps.capture.outputs.tools-capture-path }}
          PROMPTS_CAPTURE_PATH: ${{ steps.capture.outputs.prompts-capture-path }}
          TEMPLATES_CAPTURE_PATH: ${{ steps.capture.outputs.resource-templates-capture-path }}
        run: |
          test "$STATUS" = "0"
          test -s "$CAPTURE_PATH"
          test -s "$PROMPTS_CAPTURE_PATH"
          test -s "$TEMPLATES_CAPTURE_PATH"

  compare:
    needs: [package, capture]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          name: cli-package
          path: ${{ runner.temp }}/cli

      - uses: actions/download-artifact@v5
        with:
          name: mcp-tools-capture
          path: ${{ runner.temp }}/mcp-tools-capture

      - name: Compare the capture with the baseline
        id: diff
        uses: ./
        with:
          version: file:${{ runner.temp }}/cli/${{ needs.package.outputs.tarball }}
          check: "false"
          snapshot-diff-before-dir: tests/fixtures/action-e2e/snapshot-baseline
          snapshot-diff-after-dir: ${{ runner.temp }}/mcp-tools-capture
          snapshot-diff-fail-on: breaking
          snapshot-diff-comment: "true"
          output-dir: ${{ runner.temp }}/compare
          artifact-name: mcp-tools-diff

      - name: Check the comparison
        shell: bash
        env:
          STATUS: ${{ steps.diff.outputs.status }}
          DIFF_JSON: ${{ steps.diff.outputs.snapshot-diff-json-path }}
        run: |
          test "$STATUS" = "0"
          node -e '
            const report = JSON.parse(require("node:fs").readFileSync(process.env.DIFF_JSON, "utf8"));
            if (report.status !== "pass" || !report.comparison.complete || report.comparison.breaking !== 0 || report.comparison.unclassified !== 0) {
              console.error(`Unexpected snapshot comparison: ${JSON.stringify(report.comparison)}`);
              process.exit(1);
            }
            // Every list is offered by the example server, so each one must be compared and unchanged.
            for (const [key, list] of Object.entries(report.lists)) {
              const { complete, added, removed, changed } = list.diff?.comparison ?? {};
              if (list.outcome !== "compared" || list.diff.status !== "pass" || !complete || added !== 0 || removed !== 0 || changed !== 0) {
                console.error(`Unexpected ${key} comparison: ${JSON.stringify({ outcome: list.outcome, comparison: list.diff?.comparison })}`);
                process.exit(1);
              }
            }
          '
