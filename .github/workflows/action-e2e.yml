name: Action E2E

# Runs the composite Action from this checkout on a real runner with the CLI built from the same
# commit, following the two-job pattern of the workflow init-ci --tools-diff-server --prompts-baseline
# writes: a capture job that starts the example stdio server in the Docker sandbox and saves its tool
# and prompt lists, and a compare job that diffs both against committed baselines and comments on the
# pull request.
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A newer push replaces a running check, so overlapping compare jobs never race on the comment.
concurrency:
  group: action-e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      tarball: ${{ steps.pack.outputs.tarball }}
      image: ${{ steps.pack.outputs.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Pack the CLI
        id: pack
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cli"
          tarball="$(npm pack --silent --ignore-scripts --pack-destination "$RUNNER_TEMP/cli")"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
          echo "image=$(node --input-type=module -e 'const { DOCKER_RUNTIME_IMAGE } = await import("./dist/core/runtime-sandbox.js"); process.stdout.write(DOCKER_RUNTIME_IMAGE);')" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: cli-package
          path: ${{ runner.temp }}/cli
          if-no-files-found: error

  capture:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          name: cli-package
          path: ${{ runner.temp }}/cli

      # Pulling first, with retries, keeps a slow or failed registry pull from looking like a capture failure.
      - name: Pull the sandbox image
        shell: bash
        env:
          IMAGE: ${{ needs.package.outputs.image }}
        run: |
          for attempt in 1 2 3; do
            if docker pull --quiet "$IMAGE"; then exit 0; fi
            if [ "$attempt" -lt 3 ]; then sleep 15; fi
          done
          exit 1

      - name: Capture the example server in the Docker sandbox
        id: capture
        uses: ./
        with:
          version: file:${{ runner.temp }}/cli/${{ needs.package.outputs.tarball }}
          path: examples/codex-doctor-runtime
          check: "false"
          runtime: "true"
          tools-capture-server: doctorRuntime
          tools-capture-sandbox: docker
          tools-capture-defer-findings: "true"
          prompts-capture-server: doctorRuntime
          prompts-capture-sandbox: docker
          prompts-capture-defer-findings: "true"
          output-dir: ${{ runner.temp }}/capture
          artifact-name: mcp-tools-capture

      - name: Check the capture
        shell: bash
        env:
          STATUS: ${{ steps.capture.outputs.status }}
          CAPTURE_PATH: ${{ steps.capture.outputs.tools-capture-path }}
          PROMPTS_CAPTURE_PATH: ${{ steps.capture.outputs.prompts-capture-path }}
        run: |
          test "$STATUS" = "0"
          test -s "$CAPTURE_PATH"
          test -s "$PROMPTS_CAPTURE_PATH"

  compare:
    needs: [package, capture]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v5
        with:
          name: cli-package
          path: ${{ runner.temp }}/cli

      - uses: actions/download-artifact@v5
        with:
          name: mcp-tools-capture
          path: ${{ runner.temp }}/mcp-tools-capture

      - name: Compare the capture with the baseline
        id: diff
        uses: ./
        with:
          version: file:${{ runner.temp }}/cli/${{ needs.package.outputs.tarball }}
          check: "false"
          tools-diff-before: tests/fixtures/action-e2e/tools-baseline.json
          tools-diff-after: ${{ runner.temp }}/mcp-tools-capture/mcp-tools-current.json
          tools-diff-fail-on: breaking
          tools-diff-comment: "true"
          prompts-diff-before: tests/fixtures/action-e2e/prompts-baseline.json
          prompts-diff-after: ${{ runner.temp }}/mcp-tools-capture/mcp-prompts-current.json
          prompts-diff-fail-on: breaking
          prompts-diff-comment: "true"
          output-dir: ${{ runner.temp }}/compare
          artifact-name: mcp-tools-diff

      - name: Check the comparison
        shell: bash
        env:
          STATUS: ${{ steps.diff.outputs.status }}
          DIFF_JSON: ${{ steps.diff.outputs.tools-diff-json-path }}
          PROMPTS_DIFF_JSON: ${{ steps.diff.outputs.prompts-diff-json-path }}
        run: |
          test "$STATUS" = "0"
          node -e '
            for (const name of ["DIFF_JSON", "PROMPTS_DIFF_JSON"]) {
              const report = JSON.parse(require("node:fs").readFileSync(process.env[name], "utf8"));
              const { complete, added, removed, changed, breaking, unclassified } = report.comparison;
              if (report.status !== "pass" || !complete || added !== 0 || removed !== 0 || changed !== 0 || breaking !== 0 || unclassified !== 0) {
                console.error(`Unexpected ${report.scope} comparison: ${JSON.stringify(report.comparison)}`);
                process.exit(1);
              }
            }
          '
