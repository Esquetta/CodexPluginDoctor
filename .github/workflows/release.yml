name: Release

# Publishes a stable release after a version bump reaches main: the vX.Y.Z tag, npm (trusted
# publishing), then the GitHub release with notes from CHANGELOG.md. Each step is skipped
# when its part already exists, so re-running the workflow only completes what is missing.
on:
  push:
    branches:
      - main
    paths:
      - package.json
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# Runs go one at a time, in order. queue: max keeps every pending run; the default keeps only the newest.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    # Manual runs can pick any branch; releases only ever come from main.
    if: github.repository == 'Esquetta/CodexPluginDoctor' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Determine release state
        id: state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "Prerelease ${version} is published manually with the next dist-tag."
            echo "npm=skip" >> "$GITHUB_OUTPUT"
            echo "release=skip" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Re-running an old run after a newer version shipped must not move npm or GitHub "latest" back.
          latest="$(npm view codex-plugin-doctor dist-tags.latest 2>/dev/null || true)"
          if [[ -n "$latest" && "$latest" != "$version" && "$(printf '%s\n' "$latest" "$version" | sort -V | tail -n 1)" == "$latest" ]]; then
            echo "::error::npm latest is already ${latest}, newer than ${version}. Release older versions by hand without moving latest."
            exit 1
          fi
          published="$(npm view "codex-plugin-doctor@${version}" version 2>/dev/null || true)"
          if [[ "$published" == "$version" ]]; then
            npm=done
          else
            npm=pending
          fi
          # gh release view also finds drafts and prereleases. Neither is a finished stable release, so stop instead of skipping it.
          if release_kind="$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq 'if .isDraft then "draft" elif .isPrerelease then "prerelease" else "published" end' 2>/dev/null)"; then
            if [[ "$release_kind" != "published" ]]; then
              echo "::error::The GitHub release for ${tag} is a ${release_kind}. Publish it as a stable release or delete it, then re-run this workflow."
              exit 1
            fi
            release=done
          else
            release=pending
          fi
          # The tag records the commit npm was built from, so npm and the release must both come from it.
          create_tag=false
          if [[ "$npm" == "pending" || "$release" == "pending" ]]; then
            # For an annotated tag, the peeled "^{}" line comes last and names the commit.
            tag_commit="$(git ls-remote origin "refs/tags/${tag}" "refs/tags/${tag}^{}" | tail -n 1 | cut -f1)"
            if [[ -z "$tag_commit" ]]; then
              if [[ "$npm" == "done" ]]; then
                echo "::error::codex-plugin-doctor@${version} is on npm but ${tag} does not exist, so the commit it was built from is unknown. Push ${tag} at that commit, then re-run this workflow."
                exit 1
              fi
              create_tag=true
            elif [[ "$tag_commit" != "$GITHUB_SHA" ]]; then
              echo "::error::${tag} points at ${tag_commit}, not ${GITHUB_SHA}. Re-run the workflow run for ${tag_commit}, or move or delete the tag, then try again."
              exit 1
            fi
          fi
          echo "npm=${npm}" >> "$GITHUB_OUTPUT"
          echo "release=${release}" >> "$GITHUB_OUTPUT"
          echo "create_tag=${create_tag}" >> "$GITHUB_OUTPUT"

      # Stable versions always install dependencies, because the sync check at the end builds the CLI.
      - name: Install dependencies
        if: steps.state.outputs.npm != 'skip'
        run: npm ci

      - name: Run tests
        if: steps.state.outputs.npm == 'pending' || steps.state.outputs.release == 'pending'
        run: npm test

      - name: Build CLI
        if: steps.state.outputs.npm == 'pending' || steps.state.outputs.release == 'pending'
        run: npm run build

      - name: Extract release notes
        if: steps.state.outputs.npm == 'pending' || steps.state.outputs.release == 'pending'
        env:
          VERSION: ${{ steps.state.outputs.version }}
        run: node scripts/extract-release-notes.mjs "$VERSION" > "$RUNNER_TEMP/release-notes.md"

      # The tag goes up before npm, so a later recovery run can only release the commit npm was built from.
      - name: Create tag
        if: steps.state.outputs.create_tag == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.state.outputs.tag }}
        run: gh api "repos/${GITHUB_REPOSITORY}/git/refs" -f ref="refs/tags/${TAG}" -f sha="$GITHUB_SHA"

      # Trusted publishing authenticates with this workflow's OIDC token; no npm token or OTP is stored.
      # Tests and the build already ran above, so prepublishOnly is skipped.
      - name: Publish to npm
        if: steps.state.outputs.npm == 'pending'
        run: |
          npm install --global npm@11.11.1
          npm publish --access public --provenance --ignore-scripts

      - name: Create GitHub release
        if: steps.state.outputs.release == 'pending'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.state.outputs.tag }}
        run: >
          gh release create "$TAG"
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "$TAG"
          --notes-file "$RUNNER_TEMP/release-notes.md"
          --latest

      # Runs for every stable version, so a re-run still checks a release whose parts already existed.
      # npm can take several minutes to report the new latest version, so the check waits up to ten.
      - name: Verify release sync
        if: steps.state.outputs.npm != 'skip'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 20); do
            if npm run verify-release-sync; then
              exit 0
            fi
            if [ "$attempt" -lt 20 ]; then sleep 30; fi
          done
          exit 1
